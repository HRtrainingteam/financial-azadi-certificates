<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Financial Azadi Quiz — Certificate Portal</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">

    <section class="card">

      <div class="tricolor-line"></div>

      <div class="brand">SMC</div>

      <h1>Congratulations!</h1>

      <p class="subtitle">
        Financial Azadi Quiz — Certificate Portal
      </p>

      <p class="intro">
        Enter your Employee Code to access your certificate.
      </p>

      <form id="lookupForm">

        <label for="employeeCode">
          Employee Code
        </label>

        <input
          id="employeeCode"
          name="employeeCode"
          type="text"
          placeholder="Enter Employee Code"
          autocomplete="off"
          required
        >

        <button
          type="submit"
          id="lookupBtn"
        >
          Get My Certificate
        </button>

      </form>

      <div
        id="message"
        class="message"
        aria-live="polite"
      ></div>


      <section
        id="certificatePanel"
        class="certificate-panel"
        hidden
      >

        <h2 id="winnerName"></h2>

        <p id="winnerText"></p>

        <canvas
          id="certificateCanvas"
        ></canvas>

        <button
          id="downloadBtn"
          class="download-btn"
          type="button"
        >
          Download My Certificate
        </button>

      </section>


      <p class="note">
        Your certificate is generated using the official certificate design.
      </p>

    </section>

  </main>


  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js">
  </script>

  <script src="data.js?v=1"></script>
  <script src="script.js?v=1"></script>

</body>
</html>
